<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas Operacionais Modernos - Guia Interativo</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --accent: #059669;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --muted: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        sidebar {
            width: 300px;
            background: var(--primary);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 24px 20px;
            background: #172554;
            border-bottom: 1px solid #1e40af;
        }

        .sidebar-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .sidebar-header p {
            font-size: 0.8rem;
            color: #93c5fd;
            margin-top: 4px;
        }

        .nav-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            padding: 12px 0;
        }

        .nav-item {
            padding: 14px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            border-left: 4px solid transparent;
            font-size: 0.95rem;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .nav-item.active {
            background: rgba(255,255,255,0.15);
            border-left-color: #60a5fa;
            font-weight: 600;
        }

        /* Main Content Area */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .topic-header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
        }

        .topic-title {
            font-size: 2rem;
            color: var(--primary);
        }

        .topic-subtitle {
            color: var(--muted);
            margin-top: 6px;
            font-size: 1.05rem;
        }

        .content-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }

        /* Interactive Elements */
        .interactive-box {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 20px;
            margin-top: 16px;
            border: 1px dashed #cbd5e1;
        }

        .btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        /* Hardware Layers Visualizer */
        .layer-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 500px;
            margin: 20px 0;
        }

        .layer {
            padding: 16px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            color: white;
            transition: transform 0.2s;
        }

        .layer-user { background: #0284c7; }
        .layer-os { background: #059669; }
        .layer-hw { background: #475569; }

        /* CPU Scheduling Simulator */
        .process-bar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            height: 40px;
        }

        .process-block {
            background: #3b82f6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Memory Paging Visualizer */
        .page-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .page-box {
            background: white;
            border: 2px solid #cbd5e1;
            padding: 12px;
            text-align: center;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .page-box.active {
            border-color: var(--accent);
            background: #ecfdf5;
            color: #047857;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <sidebar>
        <div class="sidebar-header">
            <h1>Sistemas Operacionais Modernos</h1>
            <p>Tanenbaum & Bos (4ª Edição)</p>
        </div>
        <ul class="nav-list" id="navList">
            <!-- Inserido dinamicamente pelo JavaScript -->
        </ul>
    </sidebar>

    <main id="mainContent">
        <!-- Conteúdo carregado dinamicamente -->
    </main>

    <script>
        const topics = [
            {
                id: 'intro',
                title: '1. Introdução aos SOs',
                subtitle: 'Visão Geral e Camadas de Abstração',
                content: `
                    <p>Um sistema operacional (SO) atua como camada intermediária entre os programas do usuário e o hardware real. Fornece abstrações limpas (como arquivos e processos) e gerencia recursos (CPU, memória, E/S).</p>
                    
                    <div class="interactive-box">
                        <h3>Camadas do Sistema (Passe o mouse por cima)</h3>
                        <div class="layer-stack">
                            <div class="layer layer-user" onmouseover="showDetail('Programas de usuário (Navegadores, Jogos) em modo usuário.')">Modo Usuário / Aplicações</div>
                            <div class="layer layer-os" onmouseover="showDetail('O Núcleo (Kernel) do SO executando em modo supervisor/núcleo.')">Modo Núcleo / Sistema Operacional</div>
                            <div class="layer layer-hw" onmouseover="showDetail('Processador, Memória, Discos e Dispositivos de E/S.')">Hardware do Computador</div>
                        </div>
                        <p id="layerDetail" style="margin-top: 10px; font-weight: 500; color: var(--primary);">Passe o cursor sobre uma camada para ver detalhes.</p>
                    </div>
                `
            },
            {
                id: 'processes',
                title: '2. Processos e Threads',
                subtitle: 'Concorrência e Escalonamento da CPU',
                content: `
                    <p>Um <b>Processo</b> é um programa em execução com seu próprio espaço de endereçamento. Uma <b>Thread</b> é uma unidade mais leve de execução dentro de um processo.</p>
                    
                    <div class="interactive-box">
                        <h3>Simulador de Escalonamento (Round-Robin)</h3>
                        <p>A CPU alterna rapidamente entre diferentes processos dando a ilusão de execução simultânea (multiprogramação).</p>
                        <button class="btn" style="margin-top: 10px;" onclick="simulateScheduling()">Executar Ciclos de CPU</button>
                        <div class="process-bar" id="processContainer"></div>
                    </div>
                `
            },
            {
                id: 'memory',
                title: '3. Gerenciamento de Memória',
                subtitle: 'Memória Virtual e Paginação',
                content: `
                    <p>A memória virtual permite que o sistema execute programas maiores que a RAM física através da <b>Paginação</b>, dividindo a memória em blocos chamados páginas.</p>
                    
                    <div class="interactive-box">
                        <h3>Visualizador de Mapeamento de Páginas</h3>
                        <button class="btn" onclick="randomPageAccess()">Acessar Página Aleatória</button>
                        <div class="page-grid" id="pageGrid">
                            <div class="page-box" id="p0">Página 0 (RAM)</div>
                            <div class="page-box" id="p1">Página 1 (RAM)</div>
                            <div class="page-box" id="p2">Página 2 (Disco)</div>
                            <div class="page-box" id="p3">Página 3 (RAM)</div>
                        </div>
                        <p id="pageStatus" style="margin-top: 10px; font-size: 0.9rem; color: var(--muted);"></p>
                    </div>
                `
            },
            {
                id: 'files',
                title: '4. Sistemas de Arquivos',
                subtitle: 'Organização e Armazenamento',
                content: `
                    <p>Os sistemas de arquivos abstraem discos e memórias flash em coleções de arquivos e diretórios estruturados (ex: NTFS, ext4, FAT32).</p>
                    <ul>
                        <li><b>Inodes / Tabelas:</b> Guardam metadados dos arquivos (tamanho, permissões, blocos de dados).</li>
                        <li><b>Journaling:</b> Registro de alterações para evitar corrupção em falhas de energia.</li>
                    </ul>
                `
            },
            {
                id: 'io',
                title: '5. Entrada e Saída (E/S)',
                subtitle: 'Controladores, DMA e Interrupções',
                content: `
                    <p>O software de E/S organiza-se em camadas: Tratadores de Interrupção &rarr; Drivers de Dispositivo &rarr; Software Independente de Dispositivo &rarr; Espaço do Usuário.</p>
                `
            },
            {
                id: 'deadlocks',
                title: '6. Impasses (Deadlocks)',
                subtitle: 'Bloqueios Mútuos de Recursos',
                content: `
                    <p>Um Impasse ocorre quando dois ou mais processos ficam bloqueados à espera de recursos mantidos uns pelos outros.</p>
                    <p><b>Condições para Impasse:</b> Exclusão Mútua, Posse e Espera, Sem Preempção e Espera Circular.</p>
                `
            },
            {
                id: 'virtualization',
                title: '7. Virtualização e Nuvem',
                subtitle: 'Hipervisores Tipo 1 e Tipo 2',
                content: `
                    <p>A virtualização permite a execução de múltiplos sistemas operacionais no mesmo hardware através de um <b>Hipervisor</b> (ex: VMware, KVM).</p>
                `
            },
            {
                id: 'security',
                title: '9. Segurança',
                subtitle: 'Ameaças, Vulnerabilidades e Proteção',
                content: `
                    <p>Abrange mecanismos para proteger os recursos do sistema contra malwares e explorações como o <i>Buffer Overflow</i> (estouro de buffer).</p>
                `
            }
        ];

        function init() {
            const navList = document.getElementById('navList');
            topics.forEach((topic, index) => {
                const li = document.createElement('li');
                li.className = `nav-item ${index === 0 ? 'active' : ''}`;
                li.innerText = topic.title;
                li.onclick = () => loadTopic(index, li);
                navList.appendChild(li);
            });

            loadTopic(0, navList.children[0]);
        }

        function loadTopic(index, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            const topic = topics[index];
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="topic-header">
                    <h2 class="topic-title">${topic.title}</h2>
                    <p class="topic-subtitle">${topic.subtitle}</p>
                </div>
                <div class="content-card">
                    ${topic.content}
                </div>
            `;
        }

        function showDetail(text) {
            document.getElementById('layerDetail').innerText = text;
        }

        let pCount = 0;
        function simulateScheduling() {
            const container = document.getElementById('processContainer');
            const pNames = ['P1 (Web)', 'P2 (DB)', 'P3 (Audio)', 'P4 (IDE)'];
            const pName = pNames[pCount % pNames.length];
            pCount++;

            const block = document.createElement('div');
            block.className = 'process-block';
            block.style.flex = '1';
            block.innerText = pName;

            if (container.children.length >= 5) {
                container.removeChild(container.firstChild);
            }
            container.appendChild(block);
        }

        function randomPageAccess() {
            const pageId = Math.floor(Math.random() * 4);
            const status = document.getElementById('pageStatus');
            
            document.querySelectorAll('.page-box').forEach(box => box.classList.remove('active'));
            
            const selected = document.getElementById(`p${pageId}`);
            selected.classList.add('active');

            if (pageId === 2) {
                status.innerText = "Falta de Página (Page Fault): A Página 2 precisa ser carregada do disco para a RAM.";
                status.style.color = '#dc2626';
            } else {
                status.innerText = `Acerto de Página (Page Hit): A Página ${pageId} foi acessada diretamente na RAM.`;
                status.style.color = '#059669';
            }
        }

        window.onload = init;
    </script>
</body>
</html>
